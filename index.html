    <script>
      (function() {
        // Prevent extension injection error: Cannot set property fetch of #<Window> which has only a getter
        try {
          var _origFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var _currentFetch = _origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(newFetch) {
              _currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {}

        // Suppress external extension errors from breaking iframe application runtime
        window.addEventListener('error', function(e) {
          if (
            (e.filename && e.filename.indexOf('chrome-extension://') !== -1) ||
            (e.message && (
              e.message.indexOf('Cannot set property fetch') !== -1 ||
              e.message.indexOf('frame_ant') !== -1
            ))
          ) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (
            e.reason &&
            typeof e.reason.message === 'string' &&
            e.reason.message.indexOf('Cannot set property fetch') !== -1
          ) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        });
      })();
    </script>
